name: Build NuSMV 2.6 (Native MSVC ARM64)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-native:
    name: Native MSVC Windows ARM64 Build
    runs-on: windows-11-arm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          #python-version: 'pypy2.7' #required, cause 2.6 src still using py2
          python-version: '3.11' #latest dont work on -arm runners
          
      - name: Human check py version
        run: |
          python --version
          pip install sgmllib3k

      - name: Install 2to3 Utility
        run: pip install 2to3

      - name: Install Build Tools via Choco & Pip
        run: |
          # Install dependencies and the mandatory winflexbison engines
          choco install winflexbison3 pkgconfiglite ninja -y
          pip install meson

      - name: Download NuSMV 2.7.1 Source
        shell: powershell
        if: true
        run: |
          Invoke-WebRequest -Uri "https://nusmv.fbk.eu/distrib/NuSMV-2.6.0.tar.gz" -OutFile "nusmv.tar.xz"
          
      - name: Unarchive
        run: |
          tar -xf nusmv.tar.xz
          Get-ChildItem -Path "." -Recurse | Select-Object -ExpandProperty FullName
          Get-ChildItem -Path "NuSMV-*" -Directory | Rename-Item -NewName "nusmv-src"


      - name: Perform In-Place Conversion
        run: |
          # -w overwrites the file in-place and creates a .bak backup file
          # -n disables backup generation if you don't want the script0.py.bak file
          cd nusmv-src
          cd NuSMV
          cd cmake
          Get-ChildItem -Path "." -Recurse | Select-Object -ExpandProperty FullName
          2to3 -w combine_grammar.py
          
      - name: Perform In-Place Conversion
        run: |
          # -w overwrites the file in-place and creates a .bak backup file
          # -n disables backup generation if you don't want the script0.py.bak file
          cd nusmv-src
          cd scripts
          2to3 -w create_help.py
# Rename-Item -Path "NuSMV-2.6.0" -NewName "NewName"

      - name: Patch sgmllib Import for Python 3
        shell: powershell
        run: |
          $FilePath = "nusmv-src/scripts/html2text.py"
          (Get-Content -Path $FilePath) -replace 'import sgmllib', 'import sgmllib3k as sgmllib' | Set-Content -Path $FilePath

 
      - name: Configure Meson Build System
        shell: cmd
        if: false
        run: |
          :: Explicitly invoke within the MSVC target environment via native variables
          cd nusmv-src
          :: meson setup builddir --backend ninja --buildtype release --prefix="%CD%\..\dist"
          meson setup builddir --backend ninja --buildtype release -Dline_editing=disabled --prefix="%CD%\..\dist"

      - name: Compile and Install with Ninja
        shell: cmd
        if: false
        run: |
          cd nusmv-src
          meson compile -C builddir
          meson install -C builddir

      - name: cmake config build dir
        run: |
          cd nusmv-src
          cd NuSMV
          mkdir build
          cd build
          cmake .. '-DCMAKE_POLICY_VERSION_MINIMUM=3.5' -DENABLE_READLINE=OFF

      - name: cmake build 
        run: |
          cd nusmv-src
          cd NuSMV
          cd build
          cmake --build . --config Release

      - name: Clean and Format for Alloy
        shell: powershell
        run: |
          if (Test-Path "dist\include") { Remove-Item -Recurse -Force "dist\include" }
          if (Test-Path "dist\lib") { Remove-Item -Recurse -Force "dist\lib" }
          if (Test-Path "dist\share") { Remove-Item -Recurse -Force "dist\share" }
          
          # Match lowercase binary string expectation for Alloy 6 auto-detection
          if (Test-Path "dist\bin\NuSMV.exe") {
              Move-Item -Path "dist\bin\NuSMV.exe" -Destination "dist\bin\nusmv.exe"
          }

      - name: Upload Native Windows ARM64 Binary
        uses: actions/upload-artifact@v4
        with:
          name: NuSMV-2.7.1-MSVC-ARM64
          path: dist/
          retention-days: 7
