name: Build NuSMV (Ubuntu)

on:
#  push:
#    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ubuntu-x64:
    name: Direct compiling in ubuntu-22.04
    runs-on: ubuntu-22.04 #24.04 has problem with python3, requiring 2to3 on the fly?

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Download/Expand NuSMV Source
        run: |
          mkdir -p nusmv-src
          cat  NuSMV-2.6.0.tar.gz | tar -xzf - --strip-components=1 -C nusmv-src
          find .
#  
#          tar -xJ --strip-components=1 -C nusmv-src NuSMV-2.6.0.tar.gz
#          wget -qO- https://nusmv.fbk.eu/distrib/2.7.1/NuSMV-2.7.1.tar.xz | tar -xJ --strip-components=1 -C nusmv-src
      # This action pulls down MSVC/SDK libs and handles case-insensitivity
      - name: Install Cross-Compilation Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            bison \
            flex \
            llvm \
            clang \
            lld \
            wget \
            libreadline-dev \
            tar \
            xz-utils

      - name: Default to Python2
        run: |
          sudo apt install python2
          sudo update-alternatives --install /usr/bin/python python /usr/bin/python3 1
          sudo update-alternatives --install /usr/bin/python python /usr/bin/python2 2
          python --version

      # Step 1: Initialize the tracking system
      - name: Initialize Python Logger
        run: |
          # Create a global log file location
          LOG_FILE="/tmp/python_execution_log.txt"
          touch "$LOG_FILE"
          chmod 666 "$LOG_FILE"
          
          # Find the real path of the current python executable
          REAL_PYTHON=$(which python || which python2)
          echo "Real Python path: $REAL_PYTHON"

          # Create our custom wrapper script directory
          WRAPPER_DIR="/tmp/python-wrapper-bin"
          mkdir -p "$WRAPPER_DIR"

          # Write the wrapper script
          cat << 'EOF' > "$WRAPPER_DIR/python"
          #!/bin/bash
          LOG_FILE="/tmp/python_execution_log.txt"
          REAL_PYTHON="REAL_PYTHON_PLACEHOLDER"
          
          # Append the exact arguments to our global log file
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] $REAL_PYTHON $*" >> "$LOG_FILE"
          
          # Execute the actual python binary with all arguments
          exec "$REAL_PYTHON" "$@"
          EOF

          # Inject the true Python path into the wrapper script
          sed -i "s|REAL_PYTHON_PLACEHOLDER|$REAL_PYTHON|g" "$WRAPPER_DIR/python"
          chmod +x "$WRAPPER_DIR/python"

          # Also create a 'python3' alias pointing to the same wrapper
          ln -s "$WRAPPER_DIR/python" "$WRAPPER_DIR/python3"

          # Prepend our wrapper directory to the GitHub PATH for subsequent steps
          echo "$WRAPPER_DIR" >> $GITHUB_PATH

      - name: Create LLVM Windows ARM64 Toolchain File
        run: |
          cat << 'EOF' > win-arm64-toolchain.cmake
          set(CMAKE_SYSTEM_NAME Windows)
          set(CMAKE_SYSTEM_PROCESSOR ARM64)

          # Force LLVM/Clang for cross-compiling to PE/COFF Windows target
          set(CMAKE_C_COMPILER clang)
          set(CMAKE_C_COMPILER_TARGET aarch64-pc-windows-msvc)
          set(CMAKE_CXX_COMPILER clang++)
          set(CMAKE_CXX_COMPILER_TARGET aarch64-pc-windows-msvc)

          # Use lld-link as the linker for MSVC-compatible output
          set(CMAKE_LINKER lld-link)
          
          # Target environments
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          EOF

      - name: Configure CMake
        run: |
          mkdir -p nusmv-src/build
          cd nusmv-src/build
          export CFLAGS="-D_DEFAULT_SOURCE -D_XOPEN_SOURCE=500 -DNUSMV_HAVE_UNISTD_H"
          export CXXFLAGS="-D_DEFAULT_SOURCE -D_XOPEN_SOURCE=500 -DNUSMV_HAVE_UNISTD_H -std=c++98"
          sed -i 's/union wait status;/int status;/g' ../cudd-2.4.1.1/util/pipefork.c
          cmake ../NuSMV/ -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=../../dist

      - name: Build and Install NuSMV
        run: |
          cd nusmv-src/build
          ninja
          ninja install

      - name: Clean up Package Structure
        run: |
          # Strip unnecessary development headers to reduce file size
          rm -rf dist/include dist/lib dist/share
          # Rename the executable for easy Alloy 6 detection
          if [ -f "dist/bin/NuSMV.exe" ]; then
            mv dist/bin/NuSMV.exe dist/bin/nusmv.exe
          fi

      - name: Upload Compiled Binaries
        uses: actions/upload-artifact@v4
        with:
          name: NuSMV-2.6.0-ubuntu-24.04
          path: dist/
          retention-days: 7

            # Step 3: Print out the intercepted executions
      - name: Print All Executed Python Commands
        if: always() # Ensures logs print even if prior python steps failed
        run: |
          echo "========================================="
          echo "       CAPTURED PYTHON EXECUTIONS        "
          echo "========================================="
          if [ -f /tmp/python_execution_log.txt ]; then
            cat /tmp/python_execution_log.txt
          else
            echo "No python executions were logged."
          fi
          echo "========================================="
